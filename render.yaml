databases:
  - name: 10xdaily-db
    databaseName: dailyknowledge
    plan: free

services:
  - type: web
    name: 10xdaily-api
    plan: free
    env: python
    buildCommand: "./backend/render-build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: 10xdaily-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.12

  - type: web
    name: 10xdaily-web
    plan: free
    env: static
    buildCommand: "cd frontend && ./build.sh"
    staticPublishPath: "./frontend/dist/mobile-app/browser"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: RENDER_API_URL
        fromService:
          type: web
          name: 10xdaily-api
          env: python
          property: host
