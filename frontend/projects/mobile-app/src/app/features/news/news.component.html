<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/home" fill="clear" color="dark"><ion-icon slot="icon-only" name="arrow-back"></ion-icon></ion-button>
    </ion-buttons>
    <ion-title>News</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" color="dark"><ion-icon slot="icon-only" name="search-outline"></ion-icon></ion-button>
      <ion-button fill="clear" color="dark" routerLink="/bookmarks"><ion-icon slot="icon-only" name="bookmark-outline"></ion-icon></ion-button>
      <ion-button fill="clear" color="dark"><ion-icon slot="icon-only" name="person-circle-outline"></ion-icon></ion-button>
    </ion-buttons>
  </ion-toolbar>
  
  <div class="categories-container">
    <div class="categories-scroll">
      <div *ngFor="let cat of categories" 
           class="category-tab" 
           [class.active]="segment === cat.value"
           (click)="segment = cat.value; loadNews()">
        {{ cat.label }}
      </div>
    </div>
  </div>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="loadNews($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <app-loader *ngIf="isLoading" message="Fetching latest news..."></app-loader>

  <div *ngIf="!isLoading" class="news-list">
    <div class="news-item" *ngFor="let article of articles">
      <!-- <div class="category-label">{{ article.category | uppercase }}</div> -->
      
      <div class="item-body">
        <div class="item-main" (click)="openUrl(article.url)">
          <h2 class="title">{{ article.title }}</h2>
          <div class="meta">
            <span class="source">{{ article.source }}</span>
            <span class="dot">•</span>
            <span class="date">{{ article.published_at | date:'short' }}</span>
          </div>
          <p class="summary">{{ article.summary }}</p>
        </div>
        <div class="item-actions">
          <ion-icon 
            [name]="article.is_saved ? 'bookmark' : 'bookmark-outline'" 
            class="action-icon bookmark"
            [class.saved]="article.is_saved"
            (click)="toggleSaveArticle(article, $event)">
          </ion-icon>
          <ion-icon name="chevron-forward-outline" class="action-icon" (click)="openUrl(article.url)"></ion-icon>
        </div>
      </div>
    </div>
  </div>
</ion-content>
